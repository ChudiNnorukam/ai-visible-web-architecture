name: public-repo-quality

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Compile Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Run repository quality checks
        run: python3 scripts/check_repo_quality.py

      - name: Run live audit
        run: |
          mkdir -p artifacts
          python3 scripts/audit_live_surfaces.py --json-out artifacts/live-audit.json

      - name: Upload live audit artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: live-audit
          path: artifacts/live-audit.json

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: Link check
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-path .github
            --exclude-file .lycheeignore
            README.md
            ./**/*.md
